<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>5×5 m Grid Map — Click to mark searched squares</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .controls {
            position: absolute;
            left: 10px;
            bottom: 10px;
            z-index: 400;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto;
        }

        .notice {
            color: #333;
            font-size: 13px;
            margin-bottom: 6px
        }

        .btn {
            display: inline-block;
            margin: 2px;
            padding: 6px 8px;
            border-radius: 5px;
            border: 1px solid #bbb;
            background: #f7f7f7;
            cursor: pointer;
            font-size: 13px
        }

        .btn:active {
            transform: translateY(1px)
        }

        .status {
            margin-top: 6px;
            font-size: 12px;
            color: #333
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div class="controls" id="controls">
        <div class="notice">5x5 metre squares</div>
        <div>
            <button class="btn" id="toggleGrid">Toggle grid</button>
            <button class="btn" id="exportBtn">Export searched</button>
            <button class="btn" id="importBtn">Import searched</button>
            <button class="btn" id="clearBtn">Clear searched</button>
            <button class="btn" id="locateBtn">Track location</button>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script>
        const GRID_SIZE_M = 5; // target grid size in metres
        const MAX_CELLS = 10000; // allow up to this many cells; otherwise step up
        const STORAGE_KEY = 'searchedSquares_v1';

        const map = L.map('map').setView([53.9477317, -1.0280387], 18); // default center; zoom in to see 5m squares
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22
        }).addTo(map);

        let locationMarker = null;
        let locationCircle = null;
        let watchId = null;

        let gridLayer = L.layerGroup().addTo(map);
        let showGrid = true;

        // load searched set from localStorage
        let searched = {};
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) searched = JSON.parse(raw) || {};
        } catch (e) { console.warn('Failed to read storage', e); }

        function saveStorage() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(searched)); }
            catch (e) { console.warn('Failed to write storage', e); }
        }

        function idFromXY(x, y) {
            // use integer meter coordinates as id
            return Math.round(x) + '_' + Math.round(y);
        }

        function styleForCell(isSearched) {
            return {
                weight: 0.3,
                opacity: 0.7,
                color: '#666',
                fillOpacity: isSearched ? 0.5 : 0.0,
                fillColor: isSearched ? '#2ecc71' : undefined
            };
        }

        function drawGrid() {
            gridLayer.clearLayers();
            const bounds = map.getBounds();
            const sw = bounds.getSouthWest();
            const ne = bounds.getNorthEast();
            const swM = L.CRS.EPSG3857.project(sw); // point in meters
            const neM = L.CRS.EPSG3857.project(ne);

            // ensure min/max ordering
            const minX = Math.min(swM.x, neM.x);
            const maxX = Math.max(swM.x, neM.x);
            const minY = Math.min(swM.y, neM.y);
            const maxY = Math.max(swM.y, neM.y);

            const targetStep = GRID_SIZE_M;
            let step = targetStep;

            // estimate count
            const nx = Math.ceil((maxX - minX) / step);
            const ny = Math.ceil((maxY - minY) / step);
            let count = nx * ny;

            // if too many cells, increase step size automatically (2x increments) until below threshold
            if (count > MAX_CELLS) {
                const multiplier = Math.ceil(count / MAX_CELLS);
                // choose next power of two to keep grid aligned-ish
                let factor = 1;
                while (factor < multiplier) factor *= 2;
                step = targetStep * factor;
                const nx2 = Math.ceil((maxX - minX) / step);
                const ny2 = Math.ceil((maxY - minY) / step);
                count = nx2 * ny2;
                document.getElementById('status').textContent = `Viewport large — using ${step}m squares (zoom in for ${targetStep}m). Cells: ${count}`;
            } else {
                document.getElementById('status').textContent = `Showing ${targetStep}m squares. Cells: ${count}`;
            }

            // align starting position to step grid
            const startX = Math.floor(minX / step) * step;
            const startY = Math.floor(minY / step) * step;
            const endX = Math.ceil(maxX / step) * step;
            const endY = Math.ceil(maxY / step) * step;

            // safety cap
            if ((endX - startX) / step * (endY - startY) / step > 20000) {
                document.getElementById('status').textContent = 'Too many cells to render — please zoom in.';
                return;
            }

            for (let x = startX; x < endX; x += step) {
                for (let y = startY; y < endY; y += step) {
                    const p1 = L.CRS.EPSG3857.unproject(L.point(x, y));
                    const p2 = L.CRS.EPSG3857.unproject(L.point(x + step, y));
                    const p3 = L.CRS.EPSG3857.unproject(L.point(x + step, y + step));
                    const p4 = L.CRS.EPSG3857.unproject(L.point(x, y + step));
                    const cellId = idFromXY(x, y);
                    const isSearched = !!searched[cellId];
                    const poly = L.polygon([p1, p2, p3, p4], styleForCell(isSearched));
                    poly._gridId = cellId;
                    poly._gridXY = { x: x, y: y, step: step };
                    poly.on('click', (ev) => {
                        const id = poly._gridId;
                        if (searched[id]) {
                            delete searched[id];
                            poly.setStyle(styleForCell(false));
                        } else {
                            searched[id] = { t: Date.now() };
                            poly.setStyle(styleForCell(true));
                        }
                        saveStorage();
                    });
                    // hover highlight
                    poly.on('mouseover', () => poly.setStyle({ weight: 1 }));
                    poly.on('mouseout', () => poly.setStyle({ weight: 0.3 }));
                    gridLayer.addLayer(poly);
                }
            }
        }

        // draw initially and after moves
        map.whenReady(drawGrid);
        map.on('moveend zoomend', () => { if (showGrid) drawGrid(); });

        // controls
        document.getElementById('toggleGrid').addEventListener('click', () => {
            showGrid = !showGrid;
            if (showGrid) { map.addLayer(gridLayer); drawGrid(); }
            else { map.removeLayer(gridLayer); document.getElementById('status').textContent = 'Grid hidden'; }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = { exportedAt: new Date().toISOString(), searched };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'searched-squares.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const obj = JSON.parse(reader.result);
                        if (obj && obj.searched) {
                            searched = obj.searched;
                            saveStorage();
                            drawGrid();
                            alert('Imported ' + Object.keys(searched).length + ' searched squares.');
                        } else {
                            alert('No searched data found in file.');
                        }
                    } catch (err) { alert('Failed to parse file: ' + err); }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (!confirm('Clear all searched squares?')) return;
            searched = {};
            saveStorage();
            drawGrid();
        });

        document.getElementById('locateBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser.');
                return;
            }
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                if (locationMarker) map.removeLayer(locationMarker);
                if (locationCircle) map.removeLayer(locationCircle);
                document.getElementById('status').textContent = 'Stopped tracking location';
                return;
            }
            watchId = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const accuracy = pos.coords.accuracy;

                if (!locationMarker) {
                    locationMarker = L.circleMarker([lat, lng], {
                        radius: 6,
                        color: '#007bff',
                        fillColor: '#007bff',
                        fillOpacity: 1
                    }).addTo(map);
                    locationCircle = L.circle([lat, lng], { radius: accuracy, color: '#007bff', fillOpacity: 0.15 }).addTo(map);
                } else {
                    locationMarker.setLatLng([lat, lng]);
                    locationCircle.setLatLng([lat, lng]);
                    locationCircle.setRadius(accuracy);
                }
                // map.setView([lat, lng], 18);
                document.getElementById('status').textContent = `Tracking: ${lat.toFixed(6)}, ${lng.toFixed(6)} ±${accuracy.toFixed(0)}m`;
            }, (err) => {
                alert('Could not get your location: ' + err.message);
            }, { enableHighAccuracy: true, maximumAge: 1000 });
        });

        // resize map to full window
        window.addEventListener('resize', () => map.invalidateSize());

        // keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.key === 'g') {
                document.getElementById('toggleGrid').click();
            }
        });

        // small helper: show nearest grid cell center coordinates on click (for debugging)
        map.on('click', (ev) => {
            // compute nearest cell id for full-resolution grid (5m)
            const p = L.CRS.EPSG3857.project(ev.latlng);
            const x = Math.floor(p.x / GRID_SIZE_M) * GRID_SIZE_M;
            const y = Math.floor(p.y / GRID_SIZE_M) * GRID_SIZE_M;
            const id = idFromXY(x, y);
            const latlng = L.CRS.EPSG3857.unproject(L.point(x + GRID_SIZE_M / 2, y + GRID_SIZE_M / 2));
            // show a small tooltip for one second
            const popup = L.popup({ autoClose: true, closeOnClick: false, closeButton: false, className: 'grid-popup' })
                .setLatLng(latlng)
                .setContent(`<div style="font-size:13px">cell: ${id}<br/>center: ${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}</div>`)
                .openOn(map);
            setTimeout(() => map.closePopup(popup), 1200);
        });

    </script>
</body>

</html>
